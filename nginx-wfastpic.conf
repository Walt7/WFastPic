server {
    server_name wfastpic.walterdev.eu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /home/walter/WFastPic;
    index index.html;

    # mai servire .git, dotfile e file di deploy
    location ~ /\.(?!well-known) { return 404; }
    location ~ ^/(deploy/|contatore/|nginx-.*\.conf$|README\.md$|LICENSE$) { return 404; }

    # contatore di visite (servizio Go wfastpic-contatore, solo su localhost)
    location = /api/visita {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 4k;
        access_log off;
    }
    location /statistiche/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wfastpic.walterdev.eu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wfastpic.walterdev.eu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = wfastpic.walterdev.eu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name wfastpic.walterdev.eu;
    return 404; # managed by Certbot


}