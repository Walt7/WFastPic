<!doctype html>
<!--
  Sorgente delle anteprime per WhatsApp, Telegram, Facebook, LinkedIn (og:image), 1200x630.
  Logo, nome e slogan stanno nel quadrato centrale (x 285-915): WhatsApp, nell'anteprima piccola,
  ritaglia proprio quel quadrato. ?lang=it oppure ?lang=en.
  Rigenerare (da questa cartella), poi convertire i PNG in JPEG in img/:
    msedge --headless --hide-scrollbars --window-size=1200,630 --screenshot=anteprima-it.png "file:///.../sorgenti/anteprima-social.html?lang=it"
    msedge --headless --hide-scrollbars --window-size=1200,630 --screenshot=anteprima-en.png "file:///.../sorgenti/anteprima-social.html?lang=en"
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif;
    color: #fff;
    background:
      radial-gradient(700px 420px at 50% 42%, #26334a 0%, rgba(38, 51, 74, 0) 75%),
      #141414;
    position: relative;
  }
  .foto {
    position: absolute; top: 95px; width: 560px; height: 344px;
    border-radius: 12px; overflow: hidden;
    border: 1px solid rgba(255, 255, 255, .14);
    box-shadow: 0 30px 70px rgba(0, 0, 0, .7);
    opacity: .8;
  }
  .foto img { width: 100%; height: 100%; object-fit: cover; object-position: left top; display: block; }
  .sinistra { left: -300px; transform: perspective(900px) rotateY(18deg); }
  .destra { right: -300px; transform: perspective(900px) rotateY(-18deg); }
  .destra img { object-position: right top; }
  /* Sfuma le schermate verso il centro, così il testo resta leggibile. */
  .velo {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(20,20,20,0) 0%, rgba(20,20,20,.8) 25%, #141414 33%, #141414 67%, rgba(20,20,20,.8) 75%, rgba(20,20,20,0) 100%);
  }
  .centro {
    position: absolute; left: 300px; width: 600px; top: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .logo { width: 120px; height: 120px; margin-bottom: 18px; filter: drop-shadow(0 8px 22px rgba(0,0,0,.6)); }
  h1 { font-size: 92px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
  .slogan { margin-top: 18px; font-size: 33px; font-weight: 600; line-height: 1.2; color: #4cc2ff; text-wrap: balance; }
  .sotto { margin-top: 14px; font-size: 22px; line-height: 1.35; color: #c8c8c8; }
  .tag { margin-top: 26px; display: flex; gap: 10px; justify-content: center; }
  .tag span { font-size: 19px; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.15); color: #e8e8e8; }
  .tag b { color: #ffd600; font-weight: 600; }
  .sito { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; font-size: 18px; color: #8a8a8a; letter-spacing: .3px; }
</style>
</head>
<body>
  <div class="foto sinistra"><img id="griglia" alt=""></div>
  <div class="foto destra"><img id="editor" alt=""></div>
  <div class="velo"></div>
  <div class="centro">
    <img class="logo" src="../img/icon-512.png" alt="">
    <h1>WFastPic</h1>
    <p class="slogan" id="slogan"></p>
    <p class="sotto" id="sotto"></p>
    <div class="tag" id="tag"></div>
  </div>
  <p class="sito">wfastpic.walterdev.eu</p>
<script>
  const it = new URLSearchParams(location.search).get('lang') === 'it';
  const t = it ? {
    slogan: "L'alternativa gratuita a Picasa per Windows",
    sotto: 'Scegli e sistema centinaia di foto HEIC, da tastiera',
    tag: ['<b>Spazio</b> tieni', 'Ritaglia', 'Persone', 'Open source']
  } : {
    slogan: 'The free Picasa alternative for Windows',
    sotto: 'Pick and fix hundreds of HEIC photos, from the keyboard',
    tag: ['<b>Space</b> keep', 'Crop', 'People', 'Open source']
  };
  const l = it ? 'it' : 'en';
  document.documentElement.lang = l;
  document.getElementById('griglia').src = `../img/screenshot-${l}-griglia.jpg`;
  document.getElementById('editor').src = `../img/screenshot-${l}-editor.jpg`;
  document.getElementById('slogan').textContent = t.slogan;
  document.getElementById('sotto').textContent = t.sotto;
  document.getElementById('tag').innerHTML = t.tag.map(x => `<span>${x}</span>`).join('');
</script>
</body>
</html>
