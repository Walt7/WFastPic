# Build e test a ogni push e pull request: lo stesso "dotnet build" + "dotnet test" che si fa in locale,
# su una macchina Windows pulita. Serve anche alle altre sessioni che lavorano sul repo: un errore si vede subito.
name: Build e test

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'assets/**', 'installer/winget/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build WFastPic.slnx -c Release

      - name: Test
        run: dotnet test tests/WFastPic.Core.Tests -c Release --no-build --logger "trx;LogFileName=risultati.trx"

      - name: Risultati dei test
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: risultati-test
          path: tests/WFastPic.Core.Tests/TestResults/
