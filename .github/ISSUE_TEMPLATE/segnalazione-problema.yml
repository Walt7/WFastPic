name: "Problema / Bug report"
description: "Qualcosa non funziona come dovrebbe / Something does not work as it should"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Grazie! Per un errore inatteso dell'app usa il pulsante **Segnala il problema** nel dialogo: scrive già il report, senza dati personali.
        Thanks! For an unexpected error, use the **Report the problem** button in the error dialog: it already writes the report, without personal data.

        ⚠️ Non allegare foto personali, percorsi delle cartelle o nomi di persone. / Do not attach personal photos, folder paths or people's names.
  - type: textarea
    id: cosa
    attributes:
      label: "Cosa è successo? / What happened?"
      placeholder: "Es. aprendo la cartella le miniature restano grigie / E.g. when opening the folder the thumbnails stay grey"
    validations:
      required: true
  - type: textarea
    id: passi
    attributes:
      label: "Come ripeterlo / Steps to reproduce"
      placeholder: |
        1. Apri una cartella con foto HEIC / Open a folder with HEIC photos
        2. Premi … / Press …
        3. …
  - type: textarea
    id: atteso
    attributes:
      label: "Cosa ti aspettavi? / What did you expect?"
  - type: input
    id: versione
    attributes:
      label: "Versione di WFastPic / WFastPic version"
      description: "Nel titolo della finestra o in Informazioni / In the window title or in About"
      placeholder: "1.1.0"
    validations:
      required: true
  - type: dropdown
    id: installazione
    attributes:
      label: "Come l'hai installato / How you installed it"
      options:
        - "Setup (…-setup.exe)"
        - "Zip portatile / Portable zip"
        - "Compilato dai sorgenti / Built from source"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: "Windows"
      options:
        - "Windows 11"
        - "Windows 10"
    validations:
      required: true
  - type: checkboxes
    id: tipi
    attributes:
      label: "Tipo di foto / Photo type"
      options:
        - label: "HEIC (iPhone, Samsung…)"
        - label: "JPEG"
        - label: "Altro / Other"
  - type: textarea
    id: report
    attributes:
      label: "Report dell'errore, se c'è / Error report, if any"
      description: "Dal dialogo d'errore: «Copia report» (già senza dati personali) / From the error dialog: «Copy report» (already without personal data)"
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: "Privacy"
      options:
        - label: "Non ho incluso foto personali, percorsi o nomi di persone / I did not include personal photos, paths or people's names"
          required: true
